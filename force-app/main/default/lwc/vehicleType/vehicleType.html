<template>
  <article class="slds-card">
      <div class="slds-card__header slds-grid bgColor">
        <header class="slds-media slds-media_center slds-has-flexi-truncate">
          <div class="slds-media__figure">
            <lightning-icon icon-name="utility:travel_and_places" size="small"></lightning-icon>
          </div>
          <div class="slds-media__body">
            <h2 class="slds-card__header-title">
              <a href="#" class="slds-card__header-link slds-truncate" title="Loyalty">
                <span>Select Car Type:</span>
              </a>
            </h2>
          </div>
        </header>
      </div>
      <div class="slds-card__body slds-card__body_inner">
        <lightning-layout>
          <lightning-layout-item padding="around-small" class="slds-medium-size_12-of-12 slds-large-size_6-of-12 slds-small-size_12-of-12">
            <lightning-input
              type='text'
              name="carPax"
              label="Pax:"
              value={carPax}
              onchange={handlePaxChange}>
            </lightning-input>
          </lightning-layout-item>
          <lightning-layout-item padding="around-small" class="slds-medium-size_12-of-12 slds-large-size_6-of-12 slds-small-size_12-of-12">
            <lightning-combobox
              name="limoType"
              label="Limousine:"
              value={carTypes}
              options={listOfLimo}
              onchange={handleLimoChange}>
            </lightning-combobox>
          </lightning-layout-item>
        </lightning-layout>
        <lightning-layout>
          <lightning-layout-item padding="around-small" class="slds-medium-size_12-of-12 slds-large-size_12-of-12 slds-small-size_12-of-12">
            <lightning-button class="centerComponent" variant="neutral" icon-name="utility:search" onclick={handleSearchButton} label="Search for Cars"></lightning-button>
          </lightning-layout-item>
        </lightning-layout>
        <div if:true={showCars}>
          <lightning-layout>
            <lightning-layout-item padding="around-small" class="slds-medium-size_12-of-12 slds-large-size_12-of-12 slds-small-size_12-of-12">
              <lightning-combobox
                name="carType"
                label="Car Type:"
                value={propertyLimoOptions}
                options={listOfCars}
                onchange={handleCarChange}>
              </lightning-combobox>
            </lightning-layout-item>
          </lightning-layout>
          <div if:true={selectedCarType}>
            <lightning-layout>
              <lightning-layout-item padding="around-small" class="slds-medium-size_12-of-12 slds-large-size_12-of-12">
                <lightning-button variant="brand" onclick={updateRecord} label="Save" class="centerComponent"></lightning-button>
              </lightning-layout-item>
            </lightning-layout>
          </div>
        </div>
        <div if:true={showNA}>
          <lightning-layout>
            <lightning-layout-item padding="around-small" class="centerComponent">
              <i>No available cars.</i>
            </lightning-layout-item>
          </lightning-layout>
        </div>
      </div>
    </article>
</template>
