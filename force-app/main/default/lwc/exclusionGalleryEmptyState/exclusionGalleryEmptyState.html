<template>
    <div class="slds-illustration slds-illustration_small slds-align_absolute-center empty-state" role="status">
        <div class="slds-text-align_center">
            <lightning-icon
                icon-name={iconName}
                size="large"
                alternative-text={heading}
                class="slds-m-bottom_small empty-icon"
            ></lightning-icon>
            <h3 class="slds-text-heading_medium slds-m-bottom_x-small">{heading}</h3>
            <p class="slds-text-body_regular slds-m-bottom_small">{message}</p>
            <template if:true={showUploadCta}>
                <lightning-button
                    variant="brand"
                    label="+ Upload New Image"
                    title="Upload New Image"
                    icon-name="utility:upload"
                    onclick={handleUpload}
                ></lightning-button>
            </template>
        </div>
    </div>
</template>
