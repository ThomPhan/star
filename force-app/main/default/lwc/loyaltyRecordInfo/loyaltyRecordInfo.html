<template>
    <article class="slds-card">
        <div class="slds-card__header slds-grid">
          <header class="slds-media slds-media_center slds-has-flexi-truncate">
            <div class="slds-media__figure">
              <lightning-icon icon-name="custom:custom11" size="small"></lightning-icon>
            </div>
            <div class="slds-media__body">
              <h2 class="slds-card__header-title">
                <a href="#" class="slds-card__header-link slds-truncate" title="Loyalty">
                  <span>Loyalty</span>
                </a>
              </h2>
            </div>
          </header>
        </div>
        <div class="slds-card__body slds-card__body_inner">
            <template if:true={loyaltyRecId}>
                <lightning-record-view-form object-api-name="Loyalty__c" record-id={loyaltyRecId}>
                  <p>Comp Room Night Entitlement:<br/>
                  {compRoomNightEntitlement}</p><br/>
                  <p>Comp Room Night Remaining For The Month:<br/>
                  {compRoomNightRemainingForTheMonth}</p><br/>
                  <p>Comp Room Night Remaining For The Year:<br/>
                  {compRoomNightRemainingForTheYear}</p><br/>

                  <p>Tier Review Date:<br/>
                  {tierReviewDate}</p><br/>
                  <p>Tier Balance:<br/>
                  {tierBalance}</p><br/>
                  <p>Points to Retain Current Tier:<br/>
                  {RetainCurrentTier}</p><br/>
                  <p>Points To Next Tier:<br/>
                  {nextTier}</p><br/>
                  <p>Tier Points Earned Today:<br/>
                  {pointsEarnedToday}</p><br/>
                  <p>Tier Points Earned This Week:<br/>
                  {pointsEarnedThisWeek}</p><br/>
                  <p>Tier Points Earned This Month:<br/>
                  {pointsEarnedThisMonth}</p><br/>
                  <p>Casino $ Balance:<br/>
                  {casinoBalance}</p><br/>
                  <p>Comp $ Balance:<br/>
                  {compBalance}</p><br/>
                  
                  <p>Last Successful Update:<br/>
                  {lastSuccessfulUpdate}</p>
                </lightning-record-view-form>
            </template>
            <template if:false={loyaltyRecId}>
                <div align="center">
                <i> No Loyalty record to display </i>
                </div>
            </template>
        </div>
      </article>
</template>
